<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<link rel="icon" href="/icon.png?v=2">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #e8e8e6; --card: #f6f6f4; --surface: #ffffff; --chip: #ebebe9;
    --ink: #0e0e0e; --ink-2: #555553; --muted: #9b9b98; --hair: rgba(0,0,0,.07);
    --accent: #ff5420; --accent-ink: #ffffff; --accent-soft: #ffe7dd;
    --ok: #1aa560; --err: #e5372b;
    --primary: #0e0e0e; --on-primary: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --card: #151515; --surface: #1e1e1e; --chip: #232323;
      --ink: #f2f2f0; --ink-2: #b3b3b0; --muted: #6f6f6c; --hair: rgba(255,255,255,.07);
      --accent: #ff6a3d; --accent-soft: #3a1d12;
      --primary: #f2f2f0; --on-primary: #0e0e0e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
         font: 15px/1.45 "Inter Tight", "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif;
         letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
  button { font: inherit; color: inherit; letter-spacing: inherit; }
  svg { flex-shrink: 0; display: block; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── top ── */
  .top { display: flex; align-items: center; gap: 10px; max-width: 1360px; margin: 0 auto; padding: 22px 28px 0; }
  .mark { font-weight: 700; font-size: 22px; letter-spacing: -0.05em; }
  .mark i { color: var(--accent); font-style: normal; }
  .top .sp { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px;
          background: var(--card); font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .live.off i { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 20%, transparent); }
  .folder { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 14px; border-radius: 999px; border: 0;
            background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500; max-width: 340px; transition: background .2s; }
  .folder:hover { background: var(--surface); }
  .folder span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .circle { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); flex-shrink: 0; }

  /* ── layout ── */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 14px; max-width: 1360px; margin: 0 auto; padding: 18px 28px 40px; align-items: start; }
  .card { background: var(--card); border-radius: 32px; padding: 36px; }

  /* ── hero ── */
  .eyebrow { margin: 0 0 14px; font-size: 13px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .eyebrow b { font-weight: 600; color: var(--ink); }
  h1 { margin: 0 0 28px; font-size: clamp(44px, 5.4vw, 76px); line-height: .94; font-weight: 600; letter-spacing: -0.045em; word-spacing: .06em; }
  h1 span { color: var(--muted); }

  .field { display: flex; align-items: flex-start; gap: 8px; padding: 8px 8px 8px 24px; background: var(--surface); border-radius: 30px;
           transition: box-shadow .2s; }
  .field:focus-within { box-shadow: 0 0 0 2px var(--ink); }
  textarea { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); resize: none; font: inherit; font-size: 16px;
             padding: 13px 0; min-height: 48px; max-height: 180px; line-height: 22px; letter-spacing: -0.01em; }
  textarea::placeholder { color: var(--muted); }
  .go { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); cursor: pointer;
        display: grid; place-items: center; transition: transform .2s, opacity .2s; }
  .go:hover { transform: scale(1.06); }
  .go:disabled { opacity: .35; transform: none; cursor: default; }
  .go.loading svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin: 12px 0 0 24px; font-size: 12px; color: var(--muted); }
  .hint kbd { font: 500 11px/1 "Inter Tight", sans-serif; padding: 3px 6px; border-radius: 6px; background: var(--chip); color: var(--ink-2); }
  .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; line-height: 24px; }
  .hint .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); margin: 0 8px; opacity: .6; }
  .bm { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
        font-weight: 600; text-decoration: none; cursor: grab; white-space: nowrap; }
  .bm::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
  .alert { display: none; margin-top: 14px; padding: 14px 20px; border-radius: 20px; background: color-mix(in srgb, var(--err) 10%, var(--surface)); color: var(--err); font-size: 13px; word-break: break-word; }
  .alert.show { display: block; }

  /* ── preview ── */
  .preview { display: none; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; margin-top: 28px; padding: 10px 10px 10px 10px; background: var(--surface); border-radius: 28px; }
  .preview.show { display: grid; }
  .media { position: relative; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: var(--chip); }
  /* 세로 영상도 잘리지 않게: 흐린 배경 + 전체가 보이는 앞 이미지 */
  .media img, .jt img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .media img.fg, .jt img.fg { object-fit: contain; }
  .media img.bg, .jt img.bg { object-fit: cover; filter: blur(18px) saturate(1.2) brightness(.85); transform: scale(1.25); }
  .pill { position: absolute; left: 12px; top: 12px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(255,255,255,.92);
          color: #0e0e0e; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; backdrop-filter: blur(8px); }
  .pill:empty { display: none; }
  .info { display: flex; flex-direction: column; padding: 14px 18px 12px 0; min-width: 0; }
  .site { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
  .ttl { margin-top: 8px; font-size: 22px; line-height: 1.12; font-weight: 600; letter-spacing: -0.035em;
         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .by { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
  .max { margin-top: auto; padding-top: 16px; display: flex; align-items: flex-end; gap: 10px; }
  .max b { font-size: 64px; line-height: .8; font-weight: 500; letter-spacing: -0.06em; color: var(--accent); }
  .max span { font-size: 11px; line-height: 1.3; color: var(--muted); padding-bottom: 2px; }
  .skeleton .media, .skeleton .sk { background: linear-gradient(90deg, var(--chip) 0%, var(--card) 50%, var(--chip) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  .sk { height: 16px; border-radius: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* ── options ── */
  .opts { margin-top: 32px; }
  .label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { cursor: pointer; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chip { display: inline-flex; align-items: flex-start; gap: 3px; height: 42px; padding: 11px 18px 0; border-radius: 999px; background: var(--surface);
          font-size: 15px; font-weight: 600; letter-spacing: -0.02em; transition: background .15s, color .15s; white-space: nowrap; }
  .chip sup { font-size: 10px; font-weight: 500; color: var(--muted); line-height: 1; margin-top: 1px; letter-spacing: 0; }
  .chips label:hover .chip { background: var(--chip); }
  .chips input:checked + .chip { background: var(--primary); color: var(--on-primary); }
  .chips input:checked + .chip sup { color: var(--accent); }
  .chips input:focus-visible + .chip { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 10px; padding: 16px 18px 16px 22px;
            background: var(--surface); border-radius: 22px; cursor: pointer; }
  .toggle b { display: block; font-size: 14px; font-weight: 600; }
  .toggle small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .sw { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .sw input { position: absolute; opacity: 0; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--chip); transition: background .2s; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface);
                 box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .2s; }
  .sw input:checked + i { background: var(--primary); }
  .sw input:checked + i::after { transform: translateX(18px); background: var(--on-primary); }
  .sw input:focus-visible + i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

  .dl { margin-top: 28px; width: 100%; height: 64px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary);
        display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 30px; cursor: pointer; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
        transition: transform .15s; }
  .dl:hover { transform: translateY(-1px); }
  .dl:active { transform: translateY(0); }
  .dl:disabled { opacity: .4; cursor: default; transform: none; }
  .dl .circle { width: 48px; height: 48px; background: var(--accent); color: var(--accent-ink); }

  /* ── queue ── */
  .queue { position: sticky; top: 18px; padding: 32px 0 12px; max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
  .q-head { display: flex; align-items: center; justify-content: space-between; padding: 0 32px 20px; }
  .q-title { font-size: 26px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; }
  .q-title sup { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  .q-sub { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
  .q-sub b { color: var(--ink); font-weight: 600; }
  .text-btn { border: 0; background: var(--surface); height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .text-btn:hover { background: var(--chip); }
  .text-btn:disabled { opacity: .35; cursor: default; }
  .list { overflow-y: auto; padding: 0 12px; flex: 1; scrollbar-width: thin; }

  .job { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; padding: 10px; border-radius: 22px; transition: background .15s; }
  .job + .job { margin-top: 4px; }
  .job:hover { background: var(--surface); }
  .jt { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--chip); display: grid; place-items: center; color: var(--muted); }
  .jt .tagq { position: absolute; left: 6px; bottom: 6px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(14,14,14,.78); color: #fff;
              font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; backdrop-filter: blur(6px); }
  .jb { min-width: 0; display: flex; flex-direction: column; padding: 2px 0; }
  .jtitle { font-size: 14px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .jmeta { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
  .jmeta .st { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .downloading .dot, .converting .dot { background: var(--accent); animation: blink 1.2s infinite; }
  .done .dot { background: var(--ok); }
  .error .dot { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .pct { font-size: 20px; font-weight: 500; letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
  .pct small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .track { height: 3px; border-radius: 99px; background: var(--chip); margin-top: 8px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s; }
  .converting .track i { width: 100% !important; animation: blink 1.4s infinite; }
  .open { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: transform .2s; }
  .open:hover { transform: rotate(45deg); }
  .open.save { text-decoration: none; }
  .open.save:hover { transform: translateY(2px); }
  .jerr { margin-top: 6px; font-size: 12px; color: var(--err); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }

  .empty { padding: 48px 32px 56px; }
  .empty b { display: block; font-size: 96px; line-height: .8; font-weight: 500; letter-spacing: -0.07em; color: var(--chip); }
  .empty p { margin: 18px 0 0; font-size: 13px; color: var(--muted); }

  @media (max-width: 1080px) {
    .grid { grid-template-columns: 1fr; }
    .queue { position: static; max-height: none; }
  }
  @media (max-width: 700px) {
    .top { padding: 16px 16px 0; } .folder span { display: none; } .folder { padding: 0 5px; }
    .grid { padding: 12px 16px 32px; gap: 12px; }
    .card { padding: 24px 20px; border-radius: 26px; }
    .queue { padding: 24px 0 8px; }
    .q-head { padding: 0 20px 16px; }
    .list { padding: 0 6px; }
    .preview.show { grid-template-columns: 1fr; gap: 6px; }
    .info { padding: 10px 10px 8px; }
    .job { grid-template-columns: 104px minmax(0, 1fr); gap: 12px; }
    .hint { margin-left: 20px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="sp"></div>
  <span class="live off" id="status" hidden><i></i><span>Server offline</span></span>
  <a class="folder" id="btnGuide" href="/guide" target="_blank" rel="noopener" title="How to use" style="text-decoration:none;color:inherit">
    <span>Guide</span>
    <span class="circle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17h.01M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/></svg></span>
  </a>
  <button class="folder" id="btnTeam" title="Copy the link for teammates" hidden>
    <span id="teamLabel">Team link</span>
    <span class="circle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></span>
  </button>
  <button class="folder" id="btnFolder" title="Open download folder">
    <span>Downloads</span>
    <span class="circle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
  </button>
</header>

<main class="grid">
  <section class="card">
    <h1>Video Downloader</h1>

    <div class="field">
      <textarea id="urls" rows="1" placeholder="Paste a video link" spellcheck="false"></textarea>
      <button class="go" id="btnInfo" title="Load">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="hint"><kbd>Shift</kbd> + <kbd>Enter</kbd> for multiple links</p>
    <div class="alert" id="msg"></div>

    <div class="preview" id="preview">
      <div class="media"><img class="bg" id="thumbBg" alt=""><img class="fg" id="thumb" alt=""><span class="pill num" id="vDur"></span></div>
      <div class="info">
        <div class="site" id="vSite"></div>
        <div class="ttl" id="vTitle"></div>
        <div class="by" id="vMeta"></div>
        <div class="max" id="vMax"></div>
      </div>
    </div>

    <div class="opts">
      <p class="label">Quality</p>
      <div class="chips" id="quality"></div>

      <label class="toggle">
        <div><b>Convert to H.264</b><small>Premiere compatible</small></div>
        <span class="sw"><input type="checkbox" id="h264"><i></i></span>
      </label>

      <button class="dl" id="btnDl">
        <span>Download</span>
        <span class="circle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
      </button>
    </div>
  </section>

  <aside class="card queue">
    <div class="q-head">
      <div class="q-title">Download List</div>
      <button class="text-btn" id="btnClear">Clear</button>
    </div>
    <div class="list" id="jobs"></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const ARROW = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const ICON_FILM = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>';
const ICON_MUSIC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const SPIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>';
const GO = $("btnInfo").innerHTML;
const SAVE_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13M6 12l6 6 6-6M5 21h14"/></svg>';
let IS_LOCAL = true;   // 이 PC에서 연 화면인지(팀원 PC면 false → 저장 버튼)

const DEFAULT_Q = [["best","Best",""],["2160","4K","2160"],["1440","1440p",""],["1080","1080p",""],["720","720p",""],["audio","MP3","320k"]];
const LABEL = h => h >= 2160 ? "4K" : h >= 1440 ? "1440p" : h + "p";
// [height, width] → 이름. 와이드 영상(4096x1716 등)은 가로 기준으로 4K/2.7K
const SIZE_LABEL = ([h, w]) => {
  const k = Math.max(w || 0, h * 16 / 9);
  return k >= 7600 ? "8K" : k >= 3800 ? "4K" : k >= 2500 ? (h >= 1440 ? "1440p" : "2.7K") : k >= 1900 ? (h === 1080 ? "1080p" : "FHD") : h + "p";
};
const STATUS = { queued: "Queued", downloading: "Downloading", converting: "Converting to H.264", done: "Done", error: "Failed" };

let current = null;
let NAMES = {}, SOURCE = null;   // 북마크 버튼으로 들어온 링크의 이름 / 출처(프로젝트)

function renderQuality(heights) {
  let opts = DEFAULT_Q;
  if (heights && heights.length) {
    const seen = new Set(), hs = [];
    for (const s of heights) {
      const l = SIZE_LABEL(s);
      if (s[0] >= 360 && !seen.has(l)) { seen.add(l); hs.push([String(s[0]), l, /p$/.test(l) ? "" : String(s[0])]); }
    }
    opts = [["best","Best", ""], ...hs, ["audio","MP3","320k"]];
  }
  const keep = document.querySelector('input[name=q]:checked')?.value || "best";
  $("quality").innerHTML = opts.map(([v, t, s]) =>
    `<label><input type="radio" name="q" value="${v}" ${v===keep?"checked":""}><span class="chip">${t}${s ? `<sup>${s}</sup>` : ""}</span></label>`).join("");
  if (!document.querySelector('input[name=q]:checked')) document.querySelector('input[name=q]').checked = true;
}
renderQuality();

const urls = () => $("urls").value.split(/\s+/).map(s => s.trim()).filter(s => /^https?:\/\//.test(s));
const showMsg = t => { $("msg").textContent = t || ""; $("msg").classList.toggle("show", !!t); };
const fmtDur = s => { if (!s) return ""; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,"0"); return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanErr = e => String(e).replace(/^ERROR:\s*/, "").replace(/\s*See\s+https?:\/\/\S+.*$/s, "").trim();

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.status);
  return j;
}

function autoGrow() { const t = $("urls"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }

function setPreview({ thumb = "", dur = "", site = "", title = "", meta = "", max = "" }) {
  for (const img of [$("thumb"), $("thumbBg")]) {
    img.onerror = () => { img.style.display = "none"; };
    if (thumb) { img.style.display = ""; img.src = thumb; } else { img.removeAttribute("src"); img.style.display = "none"; }
  }
  $("vDur").textContent = dur; $("vSite").textContent = site; $("vTitle").textContent = title; $("vMeta").textContent = meta; $("vMax").innerHTML = max;
}

/* ── Behance 링크: 확장 프로그램이 사용자 크롬에서 페이지를 읽고 영상 링크만 돌려줌 ── */
const BEHANCE = /^https:\/\/(www\.)?behance\.net\/gallery\/\d+/i;
const hasExt = () => document.documentElement.dataset.vdExt === "1";
const IN_APP = new URLSearchParams(location.search).has("app");   // 설치형 앱 창에서 열렸는지
let reqId = 0; const pending = {};
window.addEventListener("message", e => {
  if (e.source !== window) return;
  const m = e.data;
  if (m && m.vd === "expanded" && pending[m.id]) { pending[m.id](m); delete pending[m.id]; }
});
function expandBehance(url) {
  return new Promise(res => {
    const id = ++reqId; pending[id] = res;
    window.postMessage({ vd: "expand", id, url }, location.origin);
    setTimeout(() => { if (pending[id]) { delete pending[id]; res({ error: "Behance didn't respond in time. Try again." }); } }, 30000);
  });
}
/* 핀터레스트: 여러 장짜리(캐러셀) 핀은 서버가 영상 목록으로 풀어줌 */
const PINTEREST = /^https?:\/\/((?:[\w-]+\.)?pinterest\.[a-z.]+\/pin\/|pin\.it\/)/i;
const TVCF = /^https?:\/\/(www\.)?tvcf\.co\.kr\/play\//i;
// skip: 이번 불러오기에서 이미 풀어본 링크(한 개짜리 핀 등은 같은 불러오기 안에서 다시 묻지 않음)
const needsExpand = (u, skip) => !(skip && skip.has(u)) && (BEHANCE.test(u) || PINTEREST.test(u) || TVCF.test(u));
async function expandOne(u) {
  if (BEHANCE.test(u)) return expandBehance(u);
  try { const r = await api("/api/expand", { url: u }); return r.v && r.v.length ? r : null; }
  catch { return null; }
}
function busy(on) {
  const b = $("btnInfo"); b.disabled = on; b.classList.toggle("loading", on); b.innerHTML = on ? SPIN : GO;
}

async function loadInfo(skip) {
  if (!(skip instanceof Set)) skip = new Set();   // 버튼/엔터/붙여넣기로 새로 부를 때마다 초기화
  const list = urls();
  showMsg("");
  if (!list.length) return showMsg("Paste a link first.");
  current = null;
  const pv = $("preview");
  if (list.some(u => needsExpand(u, skip))) {
    if (list.some(u => BEHANCE.test(u)) && !hasExt()) {
      if (!IN_APP) {   // 확장이 없으면 여기서 바로 받을 수 있게 안내
        $("msg").innerHTML = 'Behance links need the Behance extension. <a href="/extension.zip" style="color:inherit;font-weight:600">Download it</a>, then follow the install steps in the team guide.';
        $("msg").classList.add("show");
        return;
      }
      $("msg").innerHTML = 'Behance links work in Chrome with the Behance extension. <a href="#" id="openChrome" style="color:inherit;font-weight:600">Open in Chrome</a>';
      $("msg").classList.add("show");
      $("openChrome").onclick = e => { e.preventDefault(); api("/api/browser"); };
      return;
    }
    busy(true); pv.classList.add("show", "skeleton"); setPreview({});
    $("vTitle").innerHTML = '<div class="sk" style="width:85%;height:20px"></div><div class="sk" style="width:55%;height:20px;margin-top:8px"></div>';
    const out = [], names = { ...NAMES }; let src = null, nSrc = 0;
    for (const u of list) {
      if (!needsExpand(u, skip)) { out.push(u); continue; }
      skip.add(u);
      const r = await expandOne(u);
      if (!r) { out.push(u); continue; }   // 한 개짜리 영상 → yt-dlp가 그대로 처리
      if (r.error || !Array.isArray(r.v)) { busy(false); pv.classList.remove("show", "skeleton"); return showMsg(r.error || "Couldn't read this link."); }
      for (const [x, n] of r.v) if (/^https?:\/\//.test(x) && !out.includes(x)) { out.push(x); names[x] = String(n || "").slice(0, 200); }
      src = r; nSrc++;
    }
    busy(false); pv.classList.remove("skeleton");
    NAMES = names;
    SOURCE = nSrc === 1 && out.length === src.v.length
      ? { t: String(src.t || "").slice(0, 300), img: /^https:\/\//.test(src.img || "") ? src.img : "", site: String(src.site || "").slice(0, 40), n: out.length } : null;
    $("urls").value = out.join("\n"); autoGrow();
    return loadInfo(skip);
  }
  if (list.length > 1) {
    pv.classList.add("show"); pv.classList.remove("skeleton");
    const src = SOURCE && SOURCE.n === list.length ? SOURCE : null;
    setPreview({ thumb: src?.img || "", site: src ? src.site : "Batch", title: src ? src.t : `${list.length} links`,
                 meta: `${src ? list.length + " videos found. " : ""}All will download at the selected quality, or the closest lower one if unavailable.`,
                 max: `<b class="num">${String(list.length).padStart(2, "0")}</b><span>videos<br>queued</span>` });
    renderQuality();
    return;
  }
  const b = $("btnInfo"); b.disabled = true; b.classList.add("loading"); b.innerHTML = SPIN;
  pv.classList.add("show", "skeleton");
  setPreview({});
  $("vTitle").innerHTML = '<div class="sk" style="width:85%;height:20px"></div><div class="sk" style="width:55%;height:20px;margin-top:8px"></div>';
  try {
    const info = await api("/api/info", { url: list[0] });
    if (NAMES[list[0]] && /^(Behance|Pinterest|TVCF|Generic|HTML5MediaEmbed)$/.test(info.site || "")) info.title = NAMES[list[0]];
    current = info;
    pv.classList.remove("skeleton");
    const top = info.heights && info.heights[0];
    setPreview({ thumb: info.thumb, dur: fmtDur(info.duration), site: info.site || "", title: info.title || "", meta: info.uploader || "",
                 max: top ? `<b>${esc(SIZE_LABEL(top))}</b><span>max<br><span class="num">${top[1] ? top[1] + "×" + top[0] : top[0] + "p"}</span></span>` : "" });
    renderQuality(info.heights);
  } catch (e) {
    pv.classList.remove("show", "skeleton");
    showMsg(cleanErr(e.message));
  } finally { b.disabled = false; b.classList.remove("loading"); b.innerHTML = GO; }
}

async function download() {
  if (urls().some(u => needsExpand(u)) && !(current && urls().length === 1)) { await loadInfo(); if (urls().some(u => BEHANCE.test(u))) return; }
  const list = urls();
  if (!list.length) return showMsg("Paste a link first.");
  const sel = document.querySelector('input[name=q]:checked');
  const quality = sel.value, label = sel.nextElementSibling.firstChild.textContent;
  const body = { urls: list, quality, label, h264: $("h264").checked };
  if (current && list.length === 1) { body.title = current.title; body.thumb = current.thumb; }
  body.names = Object.fromEntries(list.filter(u => NAMES[u]).map(u => [u, NAMES[u]]));
  $("btnDl").disabled = true;
  try {
    await api("/api/download", body);
    $("urls").value = ""; autoGrow(); current = null; NAMES = {}; SOURCE = null;
    $("preview").classList.remove("show"); showMsg("");
    renderQuality();
    poll();
  } catch (e) { showMsg(cleanErr(e.message)); }
  finally { $("btnDl").disabled = false; }
}

function jobHTML(j) {
  const audio = j.quality === "audio";
  const fmt = (j.label || (audio ? "MP3" : j.quality === "best" ? "Best" : LABEL(+j.quality))) + (j.h264 && !audio ? " · H.264" : "");
  // 완료되면 주소를 바꿔 다시 요청 → 그때까지 못 구한 썸네일은 받은 파일에서 캡처
  const src = j.thumb ? esc(j.thumb + (j.status === "done" ? "?f=1" : "")) : "";
  const img = src ? `<img class="bg" src="${src}" alt="" onerror="this.remove()"><img class="fg" src="${src}" alt="" onerror="this.remove()">` : "";
  let status = STATUS[j.status] || j.status;
  if (j.status === "downloading") status = [j.phase, j.speed].filter(Boolean).join(" · ");
  else if (j.status === "queued" && j.phase) status = j.phase;
  let right = "";
  if (j.status === "downloading") right = `<span class="pct num">${Math.floor(j.percent)}<small>%</small></span>`;
  else if (j.status === "done") right = IS_LOCAL
    ? `<button class="open" data-id="${j.id}" title="Show in folder">${ARROW}</button>`
    : j.delivered ? ""
    : `<a class="open save" href="/file/${esc(j.id)}" download title="Save to this computer">${SAVE_ICON}</a>`;
  if (j.status === "done" && !IS_LOCAL) status = j.delivered ? "Saved to your computer" : "Saving…";
  else if (j.status === "downloading" || j.status === "queued") right = "";
  const eta = j.status === "downloading" && j.eta ? ` · ${j.eta} left` : "";
  return `
    <div class="job ${j.status}">
      <div class="jt">${audio ? ICON_MUSIC : ICON_FILM}${img}<span class="tagq">${esc(fmt)}</span></div>
      <div class="jb">
        <div class="jtitle" title="${esc(j.title)}">${esc(j.title)}</div>
        ${j.error ? `<div class="jerr" title="${esc(cleanErr(j.error))}">${esc(cleanErr(j.error))}</div>` : ""}
        <div class="jmeta"><span class="st"><i class="dot"></i>${esc(status + eta)}</span>${right}</div>
        ${["queued","downloading","converting"].includes(j.status) ? `<div class="track"><i style="width:${j.percent}%"></i></div>` : ""}
      </div>
    </div>`;
}

/* 팀원: 다운로드가 끝나면 자동으로 내 컴퓨터에 저장(서버 PC에는 남지 않음). 실패하면 ↓ 버튼으로 다시 */
const AUTO = new Set();
function autoSave(jobs) {
  for (const j of jobs) {
    if (j.status !== "done" || j.delivered || AUTO.has(j.id)) continue;
    AUTO.add(j.id);
    const a = document.createElement("a");
    a.href = "/file/" + encodeURIComponent(j.id); a.download = "";
    document.body.appendChild(a); a.click(); a.remove();
  }
}

let lastHTML = "";
async function poll() {
  try {
    const r = await fetch("/api/jobs"); const { jobs, saveDir, local, team, guide } = await r.json();
    $("btnGuide").hidden = !guide;
    if (guide) $("btnGuide").href = guide;
    TEAM_URL = team || "";
    $("btnTeam").hidden = !TEAM_URL;
    $("status").hidden = true;
    IS_LOCAL = !!local;
    $("btnFolder").title = IS_LOCAL ? "Open " + saveDir : "Where your downloads are saved";
    $("btnClear").disabled = !jobs.some(j => j.status === "done" || j.status === "error");
    if (!IS_LOCAL) autoSave(jobs);
    const html = jobs.length ? jobs.map(jobHTML).join("") : `<div class="empty"><p>No downloads yet</p></div>`;
    if (html !== lastHTML) { $("jobs").innerHTML = html; lastHTML = html; }
  } catch {
    $("status").hidden = false;
  }
}
setInterval(poll, 1000); poll();

$("btnInfo").onclick = loadInfo;
$("btnDl").onclick = download;
$("btnFolder").onclick = () => {
  if (IS_LOCAL) return api("/api/open", {});   // 이 PC: 탐색기로 다운로드 폴더 열기
  // 팀원: 브라우저는 내 컴퓨터 폴더를 직접 열 수 없으므로 위치와 단축키 안내
  const mac = /Mac/i.test(navigator.platform || navigator.userAgent);
  showMsg(mac
    ? "Videos are saved to your Mac's Downloads folder. In Finder, press ⌥⌘L to open it."
    : "Videos are saved to your Downloads folder. Press Ctrl+J to see your browser downloads.");
};
let TEAM_URL = "";
$("btnTeam").onclick = async () => {   // 팀원에게 보낼 링크 복사(이 PC에서만 보임)
  try { await navigator.clipboard.writeText(TEAM_URL); $("teamLabel").textContent = "Copied"; }
  catch { prompt("Team link", TEAM_URL); }
  setTimeout(() => { $("teamLabel").textContent = "Team link"; }, 1800);
};
$("btnClear").onclick = () => api("/api/clear").then(poll);
$("jobs").onclick = e => { const b = e.target.closest("[data-id]"); if (b) api("/api/open", { id: b.dataset.id }); };
$("urls").addEventListener("paste", () => setTimeout(() => { autoGrow(); loadInfo(); }, 50));
$("urls").addEventListener("input", () => { autoGrow(); SOURCE = null; });

/* ── 북마크 버튼: Behance 등 페이지에서 눌러 영상 링크만 골라 이 화면으로 보냄 ──
   페이지는 사용자 브라우저에서 읽으므로 서버가 Behance에 접속하지 않음 */
function sendToDownloader(ORIGIN) {
  var L = [], seen = {}, T = "", img = "", isBe = /(^|\.)behance\.net$/.test(location.hostname);
  var VID = /^(https?:)?\/\/([\w-]+\.)*(vimeo\.com|youtube\.com|youtube-nocookie\.com|youtu\.be|adobe\.io|dailymotion\.com|wistia\.(com|net)|loom\.com|streamable\.com|tiktok\.com|instagram\.com|facebook\.com|twitch\.tv)\//i;
  function add(u) {
    if (!u) return;
    u = String(u).replace(/&amp;/g, "&");
    if (u.indexOf("//") === 0) u = "https:" + u;
    if (!/^https?:\/\//.test(u) || seen[u]) return;
    seen[u] = 1; L.push(u);
  }
  function fromHtml(h) { var re = /<iframe[^>]*?\ssrc=["']([^"']+)/gi, m; while ((m = re.exec(h || ""))) if (VID.test(m[1])) add(m[1]); }
  try {
    var p = JSON.parse(document.getElementById("beconfig-store_state").textContent).project.project;
    T = p.name || "";
    (p.modules || []).forEach(function (m) {
      if (m.__typename === "EmbedModule") fromHtml(m.originalEmbed || m.fluidEmbed);
      else if (m.__typename === "VideoModule") fromHtml(m.embed);
    });
  } catch (e) {}
  if (!L.length) {
    [].forEach.call(document.querySelectorAll("iframe[src]"), function (f) {
      if (VID.test(f.src)) add(f.src);
    });
    [].forEach.call(document.querySelectorAll("video"), function (v) { var s = v.currentSrc || v.src; if (s && s.indexOf("blob:") !== 0) add(s); });
  }
  if (!L.length && !isBe) add(location.href);
  if (!L.length) { alert("No videos found on this page."); return; }
  if (!T) T = document.title;
  var og = document.querySelector('meta[property="og:image"]'); if (og) img = og.content;
  var v = L.map(function (u, i) { return [u, L.length > 1 ? T + " " + (i + 1) : T]; });
  var data = { t: T, img: img, site: isBe ? "Behance" : location.hostname.replace(/^www\./, ""), v: v };
  window.open(ORIGIN + "/#add=" + encodeURIComponent(JSON.stringify(data)), "video-downloader");
}

function takeHash() {
  if (!location.hash.startsWith("#add=")) return;
  let d;
  try { d = JSON.parse(decodeURIComponent(location.hash.slice(5))); } catch { d = null; }
  history.replaceState(null, "", location.pathname + location.search);
  const v = (d && Array.isArray(d.v) ? d.v : []).filter(x => Array.isArray(x) && /^https?:\/\//.test(String(x[0]))).slice(0, 100);
  if (!v.length) return;
  NAMES = Object.fromEntries(v.filter(x => x[1]).map(x => [String(x[0]), String(x[1]).slice(0, 200)]));
  SOURCE = { t: String(d.t || "").slice(0, 300), img: /^https:\/\//.test(d.img || "") ? d.img : "", site: String(d.site || "").slice(0, 40), n: v.length };
  $("urls").value = v.map(x => x[0]).join("\n"); autoGrow();
  loadInfo();
}
window.addEventListener("hashchange", takeHash);
takeHash();
$("urls").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); loadInfo(); } });
</script>
